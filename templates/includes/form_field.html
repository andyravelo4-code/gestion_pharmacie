<div class="mb-3">
  <label class="form-label" for="{{ field.id_for_label }}">
    {{ field.label }}{% if field.field.required %} <span class="required-star">*</span>{% endif %}
  </label>
  {{ field }}
  {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
  {% for erreur in field.errors %}<div class="text-danger small mt-1">{{ erreur }}</div>{% endfor %}
</div>
